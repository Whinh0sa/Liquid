kind = "mobile"
previewPath = "/liquid-mobile/"
title = "Liquid — Mobile"
version = "1.0.0"
id = "artifacts/liquid-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/liquid-mobile/" ]
localPort = 25370

[services.development]
run = "pnpm --filter @workspace/liquid-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/liquid-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/liquid-mobile", "run", "serve" ]

[services.env]
PORT = "25370"
BASE_PATH = "/liquid-mobile/"
