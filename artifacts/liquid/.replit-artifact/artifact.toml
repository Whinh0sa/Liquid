kind = "web"
previewPath = "/"
title = "Liquid — Financial Terminal"
version = "1.0.0"
id = "artifacts/liquid"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22488

[services.development]
run = "pnpm --filter @workspace/liquid run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/liquid", "run", "build" ]
publicDir = "artifacts/liquid/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22488"
BASE_PATH = "/"
